# Chiron Stick (CLAUDE.md decision 7). Loaded after Mint's 50_linuxmint.cfg, so it wins.

# Never scan the owner's disks for other operating systems (Mint turns os-prober on):
GRUB_DISABLE_OS_PROBER=true

# Never let the kernel store crash logs in the owner's firmware (efi-pstore):
GRUB_CMDLINE_LINUX_DEFAULT="$GRUB_CMDLINE_LINUX_DEFAULT efi_pstore.pstore_disable=1"

# Show the boot menu for 5 seconds (MemTest86, recovery mode) instead of Mint's hidden menu:
GRUB_TIMEOUT_STYLE=menu
GRUB_TIMEOUT=5
# Also after a boot that never finished (Ubuntu then waits 30 s). On a stick that is often
# unplugged or powered off at the unlock prompt, that would be most boots:
GRUB_RECORDFAIL_TIMEOUT=5
