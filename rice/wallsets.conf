# Which wallpapers each mode uses (`chiron rice mode personal|client`). Entries are collection
# names from wallsources.conf, or collection/folder. Pictures removed in `chiron walls review`
# never show. The collections are downloaded on the stick and never redistributed.

[personal]
# Every collection
exclude =

[client]
# Calm, neutral pictures for other people's PCs: real photos and space
include = space elementary pop-os rose-pine/photography
