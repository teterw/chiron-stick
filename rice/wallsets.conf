# Which wallpaper categories (folders of https://github.com/dharmx/walls) each mode uses.
# The collection is for personal use only (credit belongs to the original artists): it's downloaded
# on the stick by `chiron walls update` and never redistributed.

[personal]
# Everything except the videos: Xfce can't show them, and playing them would skew test results.
exclude = animated

[client]
# Calm, neutral sets for other people's PCs (`chiron rice mode client`).
include = nature mountain minimal calm aerial fogsmoke paper cold
