# Chiron Stick wallpaper collections. `chiron walls update` downloads each one into
# ~/Pictures/walls/<name>/, and `chiron walls review` shows every picture for a keep/remove choice.
# Pictures removed in the review stay removed after updates. The order here is the review order.
#
#   git   + branch + paths: only these folders are checked out (gitignore-style patterns)
#   list: files named in a list in rice/, each checked against its SHA-256

[space]
list = space-walls.txt
about = Real telescope images from ESA/Webb and ESA/Hubble (CC BY 4.0)

[elementary]
git = https://github.com/elementary/wallpapers
branch = main
paths = /backgrounds/
about = elementary OS wallpapers: real photos by Unsplash photographers

[pop-os]
git = https://github.com/pop-os/wallpapers
branch = master
paths = /original/
about = Pop!_OS wallpapers: photos, NASA and ESA space images, commissioned art

[dracula]
git = https://github.com/dracula/wallpaper
branch = master
paths = /first-collection/ /second-collection/
about = Dracula theme: official art (MIT)

[rose-pine]
git = https://github.com/rose-pine/wallpapers
branch = main
paths = /*/ !/.github/
about = Rosé Pine: community wallpapers in Rosé Pine colours (CC0)

[d3ext]
git = https://github.com/D3Ext/aesthetic-wallpapers
branch = main
paths = /images/
about = D3Ext/aesthetic-wallpapers: illustrations, pixel art and scenery (MIT)
